[package]
name = "ferrous-nasd"
version = "0.1.0"
edition = "2021"
description = "FerrousNAS system daemon — a mocked NAS control-plane API"
license = "MIT"

[[bin]]
name = "ferrous-nasd"
path = "src/main.rs"

[dependencies]
axum = "0.7"
async-trait = "0.1"
bollard = "0.17"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
