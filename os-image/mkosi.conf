# FerrousNAS bootable image definition (mkosi).
#
# This produces a self-contained, bootable Debian-based appliance image with
# the FerrousNAS daemon baked in. Build it on a real Linux host (root +
# loopback devices required — see ../docs/OS-IMAGE.md).
#
# From an Arch/CachyOS host (mkosi builds the Debian rootfs via apt, which it
# needs present on the host):
#
#     sudo pacman -S --needed mkosi apt debian-archive-keyring qemu-system-x86
#     cd os-image
#     sudo mkosi build        # produces ferrous-nas.raw
#     sudo mkosi qemu         # boot it in a VM to try it
#
# From a Debian/Ubuntu host:
#
#     sudo apt install mkosi systemd-container qemu-system-x86 dosfstools
#     cd os-image
#     sudo mkosi build
#     sudo mkosi qemu
#
# NOTE: This cannot run in the Claude sandbox (needs a real Linux host with
# root + loopback devices). It is provided as the real, working path to an
# appliance image. See ../docs/OS-IMAGE.md for the full walkthrough.

[Distribution]
Distribution=debian
Release=bookworm
# zfsutils-linux (and its zfs-dkms dependency) live in Debian's "contrib"
# component, not "main" — ZFS's CDDL license is incompatible with Debian's
# main-archive policy. Without this, apt fails to find the package partway
# through the build.
Repositories=contrib

[Output]
Format=disk
ImageId=ferrous-nas
ImageVersion=0.1.0

[Content]
# The daemon binary and web assets are copied in from mkosi.extra/ and the
# build step below. Real NAS services are installed so a non-mock build can
# grow into them.
Bootable=yes
Packages=
    systemd
    systemd-boot
    systemd-boot-efi
    linux-image-amd64
    linux-headers-amd64
    udev
    dbus
    openssh-server
    ca-certificates
    curl
    smartmontools
    zfsutils-linux
    samba
    nfs-kernel-server
    docker.io
    sudo
    nano

# Enable the FerrousNAS service (see mkosi.postinst). No admin is pre-seeded
# — the daemon has no default password; visiting the dashboard on first boot
# runs its own one-time setup screen to create one.
Hostname=ferrous-nas

[Validation]
# For a real appliance, sign the image / enable SecureBoot here.
