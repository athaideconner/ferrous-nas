# FerrousNAS bootable image definition (mkosi).
#
# This produces a self-contained, bootable Debian-based appliance image with
# the FerrousNAS daemon baked in. Build it on a real Linux host (root +
# loopback devices required — see ../docs/OS-IMAGE.md).
#
# From an Arch/CachyOS host (mkosi builds the Debian rootfs via apt, which it
# needs present on the host):
#
#     sudo pacman -S --needed mkosi apt debian-archive-keyring qemu-system-x86 python-pefile cpio
#     cd os-image
#     sudo mkosi build        # produces ferrous-nas_0.1.0.raw
#     sudo mkosi qemu         # boot it in a VM to try it
#
# From a Debian/Ubuntu host:
#
#     sudo apt install mkosi systemd-container systemd-boot qemu-system-x86 dosfstools cpio
#     cd os-image
#     sudo mkosi build
#     sudo mkosi qemu
#
# Stage the daemon (as a static musl binary) and web assets into mkosi.extra/
# first; see ../docs/OS-IMAGE.md for the full walkthrough.

[Distribution]
Distribution=debian
Release=bookworm
# zfsutils-linux (and its zfs-dkms dependency) live in Debian's "contrib"
# component, not "main" — ZFS's CDDL license is incompatible with Debian's
# main-archive policy. Without this, apt fails to find the package partway
# through the build.
Repositories=contrib

[Output]
Format=disk
ImageId=ferrous-nas
ImageVersion=0.1.0

[Content]
# The daemon binary and web assets are copied in from mkosi.extra/ and the
# build step below. Real NAS services are installed so a non-mock build can
# grow into them.
Bootable=yes
# Kernel messages and a login prompt on both the screen and the first serial
# port, so a headless box (or `mkosi qemu`) can be watched booting.
KernelCommandLine=console=tty0 console=ttyS0
Packages=
    systemd
    systemd-sysv
    systemd-resolved
    systemd-boot
    systemd-boot-efi
    linux-image-amd64
    linux-headers-amd64
    udev
    dbus
    openssh-server
    ca-certificates
    curl
    smartmontools
    zfsutils-linux
    zfs-dkms
    samba
    nfs-kernel-server
    docker.io
    sudo
    nano

# Enable the FerrousNAS service (see mkosi.postinst.chroot). No admin is pre-seeded
# — the daemon has no default password; visiting the dashboard on first boot
# runs its own one-time setup screen to create one.
#
# systemd-firstboot.service is masked in mkosi.extra/ for the same reason:
# on an unconfigured image it stops the boot at a "Please configure your
# system!" prompt on the console, which a headless NAS never gets past.
#
# Package notes: systemd-sysv provides /sbin/init (without it the initrd
# can't switch root); systemd-resolved gives the DHCP setup in
# mkosi.extra/etc/systemd/network/ working DNS; zfs-dkms is only a Recommends
# of zfsutils-linux, and mkosi doesn't install recommends.
Hostname=ferrous-nas

[Validation]
# For a real appliance, sign the image / enable SecureBoot here.
