# FerrousNAS installer environment (mkosi).
#
# A tiny Debian system packed into a single UKI (kernel + whole rootfs as the
# initrd), so it boots straight from an ISO and runs entirely from RAM. On
# boot it starts ferrous-install on tty1, which writes the FerrousNAS disk
# image (../ferrous-nas_<version>.raw, carried on the ISO) to a disk the user
# picks, then grows the root partition to fill it.
#
# Don't build this directly — scripts/build-iso.sh builds it and wraps it,
# together with the disk image, into a bootable installer ISO.

[Distribution]
Distribution=debian
Release=trixie

[Output]
# uki: the OS image goes into the UKI's .initrd section. We deliberately do
# NOT set MakeInitrd=yes — that adds /etc/initrd-release, which would make
# systemd behave as an initrd and try to switch-root to a real root that
# doesn't exist. Without it, systemd runs this rootfs as the final system.
Format=uki
ImageId=ferrous-nas-installer
ImageVersion=0.1.0

[Content]
# The kernel starts /init from an initramfs by default; point it straight at
# systemd instead (MakeInitrd=yes would create /init, but see above).
#
# The GPU drivers that are useless without firmware (which this image
# doesn't carry) are blocked: loading one evicts simpledrm, the firmware
# framebuffer, and then fails, leaving no display for the graphical wizard.
KernelCommandLine=rdinit=/usr/lib/systemd/systemd quiet modprobe.blacklist=amdgpu,radeon,nouveau
Packages=
    systemd
    udev
    kmod
    linux-image-amd64
    # The EFI stub mkosi wraps the kernel + rootfs in to make the UKI
    systemd-boot-efi
    util-linux
    # sfdisk lives in "fdisk", not util-linux, on Debian
    fdisk
    # sgdisk -e: move the backup GPT header to the end of the target disk
    gdisk
    e2fsprogs
    zstd
    # openssl passwd: hashes the login password the installer is given
    openssl
    less
Hostname=ferrous-nas-installer
# mkosi.extra also masks systemd-firstboot.service: every boot of a RAM-only
# system is a "first boot", and its interactive locale/timezone/root-password
# prompts would grab the console before the installer.
