# Pi-hole and AdGuard Home (store apps) answer DNS for the LAN on port 53 of
# every address, which resolved's stub listener on 127.0.0.53:53 would block.
# With the stub off, /etc/resolv.conf (also in mkosi.extra) points at
# resolved's list of the real upstream servers instead of the stub.
[Resolve]
DNSStubListener=no
