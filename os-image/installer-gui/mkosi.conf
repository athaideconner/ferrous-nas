# FerrousNAS graphical installer layer (mkosi).
#
# A plain directory tree (not bootable) holding the graphical installer
# wizard and everything it needs: GTK 4 + libadwaita (Python bindings) and
# the cage kiosk compositor. scripts/build-iso.sh packs it into gui.sqfs on
# the ISO; the installer UKI (../installer/) mounts it from the medium at
# boot and runs the wizard chrooted into it, falling back to the text
# installer if it can't start. Kept out of the UKI itself so the UKI — which
# firmware loads whole into RAM — stays small.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=directory
ImageId=ferrous-nas-installer-gui
ImageVersion=0.1.0

[Content]
Bootable=no
Packages=
    python3
    python3-gi
    gir1.2-gtk-4.0
    gir1.2-adw-1
    # Wayland kiosk compositor: runs the wizard full-screen, straight on DRM
    cage
    # seatd-launch: gives cage the seat (DRM/input) without logind
    seatd
    # keymaps for libxkbcommon; without them cage has no keyboard
    xkb-data
    fonts-cantarell
    adwaita-icon-theme
    # SVG loader: without it GTK shows only the icons that also ship as PNG
    librsvg2-common
    # lsblk, to list disks
    util-linux
